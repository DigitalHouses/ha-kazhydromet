name: Publish HACS Release

on:
  workflow_dispatch:
  # One-time bootstrap: trigger v0.1.0 release from this workflow change.
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: kazhydromet-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve version and validate release readiness
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/kazhydromet/manifest.json"))["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -Fq "## $VERSION (" CHANGELOG.md
          test -s RELEASE_NOTES.md
          echo "Release candidate: v$VERSION"
      - name: Publish immutable version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; immutable release unchanged."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Kazhydromet v$VERSION" --notes-file RELEASE_NOTES.md --latest
          fi
